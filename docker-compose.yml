services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aigc
      POSTGRES_PASSWORD: aigc
      POSTGRES_DB: aigc
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigc"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pg_data:
